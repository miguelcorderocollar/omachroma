<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
<title>Omachroma, an abstract Tokyo Night landscape in blue, violet and amber</title>
<defs>
  <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1a1b26"/>
    <stop offset=".55" stop-color="#171b2b"/>
    <stop offset="1" stop-color="#0e0e14"/>
  </linearGradient>
  <radialGradient id="moon" cx=".42" cy=".35" r=".72">
    <stop offset="0" stop-color="#bb9af7" stop-opacity=".92"/>
    <stop offset=".5" stop-color="#7aa2f7" stop-opacity=".68"/>
    <stop offset="1" stop-color="#449dab" stop-opacity=".05"/>
  </radialGradient>
  <linearGradient id="distant" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#414868"/>
    <stop offset="1" stop-color="#24283b"/>
  </linearGradient>
  <linearGradient id="middle" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#30364d"/>
    <stop offset=".52" stop-color="#24283b"/>
    <stop offset="1" stop-color="#1a1b26"/>
  </linearGradient>
  <linearGradient id="aurora" x1="0" y1=".15" x2="1" y2=".8">
    <stop offset="0" stop-color="#449dab"/>
    <stop offset=".32" stop-color="#7aa2f7"/>
    <stop offset=".62" stop-color="#bb9af7"/>
    <stop offset=".82" stop-color="#f7768e"/>
    <stop offset="1" stop-color="#e0af68"/>
  </linearGradient>
  <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#414868"/>
    <stop offset=".35" stop-color="#7aa2f7"/>
    <stop offset=".62" stop-color="#bb9af7"/>
    <stop offset=".82" stop-color="#f7768e"/>
    <stop offset="1" stop-color="#e0af68"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#414868" stroke-width="1" stroke-opacity=".22"/>
  </pattern>
  <filter id="soft-glow" x="-40%" y="-80%" width="180%" height="260%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
  <filter id="small-glow" x="-40%" y="-80%" width="180%" height="260%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
</defs>
